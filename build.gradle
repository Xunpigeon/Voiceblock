plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
}

version = '1.0.0'
group = 'com.voiceblock'

base {
    archivesName = 'voiceblock'
}

repositories {
    mavenCentral()
}

dependencies {
    // Vosk 离线语音识别
    implementation "com.alphacephei:vosk:0.3.45"
    jarJar "com.alphacephei:vosk:0.3.45"
    // 中文拼音转换
    implementation "com.belerweb:pinyin4j:2.5.1"
    jarJar "com.belerweb:pinyin4j:2.5.1"
}

neoForge {
    version = '21.0.143'

    runs {
        client {
            client()
        }
    }

    mods {
        voiceblock {
            sourceSet sourceSets.main
        }
    }
}

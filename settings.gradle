pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'voiceblock-multiversion'
include 'neoforge-1.21'
include 'fabric-1.20.1'
include 'fabric-1.21'
include 'forge-1.20.1'

project(':neoforge-1.21').projectDir = file('neoforge-1.21.x')
project(':fabric-1.20.1').projectDir = file('fabric-1.20.1-1.20.4')
project(':fabric-1.21').projectDir = file('fabric-1.21.x')
project(':forge-1.20.1').projectDir = file('forge-1.20.1-1.20.6')
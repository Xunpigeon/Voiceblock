plugins {
    id 'java'
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = '1.2.0'
group = 'com.voiceblock'

base { archivesName = 'voiceblock-fabric-1.21' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:1.21"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.100.6+1.21"
    implementation "com.alphacephei:vosk:0.3.45"
    include "com.alphacephei:vosk:0.3.45"
    implementation "com.belerweb:pinyin4j:2.5.1"
    include "com.belerweb:pinyin4j:2.5.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

loom { runs { client { client() } } }

sourceSets {
    main {
        java {
            srcDir '../common/java'
            srcDir '../fabric/java'
        }
        resources {
            srcDir '../common/resources'
        }
    }
}